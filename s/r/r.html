<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resim Galerisi</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-danger: #ef4444;
      --border-color: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .alert { width: 100%; max-width: 800px; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: 500; font-size: 0.95rem; display: none; }
    .alert-success { background-color: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; color: #4ade80; }
    .gallery {
      width: 100%;
      max-width: 1000px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      justify-content: center;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4); }
    .image-link { display: block; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; background-color: #0b1120; }
    .image-link img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s ease; }
    .card:hover .image-link img { transform: scale(1.03); }
    .card-actions { padding: 12px; }
    .btn-delete {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px;
      background-color: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .btn-delete:hover { background-color: var(--accent-danger); border-color: var(--accent-danger); color: #ffffff; }
    .empty-message { text-align: center; color: #94a3b8; margin-top: 40px; font-size: 1.1rem; }
    
    /* Yükleniyor Spinner'ı için basit animasyon */
    .loading { margin-top: 40px; color: #38bdf8; font-weight: bold; }
  </style>
</head>
<body>

  <div id="alertBox" class="alert alert-success"></div>
  
  <div id="gallery" class="gallery">
    <div class="loading">Resimler Yükleniyor...</div>
  </div>

<script>
  const API_URL = "https://s-api.salmezun.workers.dev";
  const galleryDiv = document.getElementById('gallery');
  const alertBox = document.getElementById('alertBox');

  function showMsg(text) {
    alertBox.style.display = 'block';
    alertBox.textContent = text;
    setTimeout(() => { alertBox.style.display = 'none'; }, 3000);
  }

  async function loadImages() {
    try {
      const response = await fetch(`${API_URL}/api/images`);
      const files = await response.json();
      
      if (files.length === 0) {
        galleryDiv.innerHTML = "<p class='empty-message'>Henüz hiç resim bulunmuyor.</p>";
        galleryDiv.style.display = "block"; // Grid'i bozup yazıyı ortalamak için
        return;
      }

      galleryDiv.style.display = "grid";
      galleryDiv.innerHTML = "";
      
      files.forEach(file => {
        const fullUrl = API_URL + file.url;
        
        galleryDiv.innerHTML += `
          <div class="card" id="card-${file.key}">
            <a href="${fullUrl}" class="image-link" target="_blank">
              <img src="${fullUrl}" alt="${file.key}" loading="lazy">
            </a>
            <div class="card-actions">
              <button class="btn-delete" onclick="deleteImage('${file.key}')">
                🗑 Sil
              </button>
            </div>
          </div>
        `;
      });
    } catch (e) {
      galleryDiv.innerHTML = "<p class='empty-message'>Resimler yüklenirken bir hata oluştu.</p>";
    }
  }

  async function deleteImage(key) {
    if (!confirm("Bu resim kalıcı olarak silinsin mi?")) return;
    
    const btn = document.querySelector(`#card-${key} .btn-delete`);
    const originalText = btn.textContent;
    btn.textContent = "Siliniyor...";
    btn.disabled = true;

    try {
      const response = await fetch(`${API_URL}/api/images?key=${key}`, { method: 'DELETE' });
      if (response.ok) {
        document.getElementById(`card-${key}`).remove();
        showMsg("Resim silindi.");
        
        // Eğer son resim silindiyse "Henüz resim yok" uyarısını göster
        if (galleryDiv.children.length === 0) {
           galleryDiv.innerHTML = "<p class='empty-message'>Henüz hiç resim bulunmuyor.</p>";
           galleryDiv.style.display = "block";
        }
      } else {
        alert("Sunucu hatası, silinemedi.");
        btn.textContent = originalText;
        btn.disabled = false;
      }
    } catch (e) {
      alert("Bağlantı hatası.");
      btn.textContent = originalText;
      btn.disabled = false;
    }
  }

  // Sayfa açıldığında resimleri yükle
  loadImages();
</script>

</body>
</html>
