<form method="post" action="k.html">
    <p>
        <input type="hidden" name="name" value="kagan">
        <input type="text" name="content" placeholder="Mesaj" autofocus autocomplete="off">
        <button id="send-btn">yolla</button>
    </p>

<div class="logs-container" id="logs-area">
    <!-- Loglar JavaScript ile dinamik çekilip işlenecektir -->
</div>

<div class="controls">
    <a href="?r=000000">karart</a>
    <a href="?r=ffffff">aydınlat</a>
</div>

<script type="module">
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function linkify(text) {
        return text.replace(/(https?:\/\/[^\s]+)/g,
            url => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`)
    }

    const messageList     = document.querySelector("ul#messages")
    const messageTemplate = messageList.querySelector("template").content.querySelector("li")
    const sendBtn         = document.getElementById("send-btn")
    const contentInput    = document.querySelector("input[name=content]")
    window.lastDateDivider = "";

    messageList.querySelector("li").remove()

    function applyTheme(lastSender) {
        const isCemil = lastSender === "cemil"
        const isDark  = window.initialBg === "#000000"

        if (isCemil) {
            document.body.style.backgroundColor = "white"
            document.body.style.visibility      = "visible"
            contentInput.style.backgroundColor  = "white"
            sendBtn.style.backgroundColor       = "red"
            sendBtn.style.color                 = "white"
        } else if (isDark) {
            document.body.style.backgroundColor = "black"
            document.body.style.visibility      = "hidden"
        } else {
            document.body.style.backgroundColor = "white"
            document.body.style.visibility      = "visible"
            contentInput.style.backgroundColor  = "white"
            sendBtn.style.backgroundColor       = ""      
            sendBtn.style.color                 = "white"
        }
    }

    function updateLastCemilHighlight() {
        for (const li of messageList.querySelectorAll("li.last-cemil"))
            li.classList.remove("last-cemil")

        const all = Array.from(messageList.querySelectorAll("li:not(.pending):not(.date-divider)"))
        if (all.length === 0) return

        const last    = all[all.length - 1]
        const isCemil = last.classList.contains("from-cemil")
        if (isCemil) last.classList.add("last-cemil")
        applyTheme(isCemil ? "cemil" : "kagan")
    }

    document.querySelector("form").addEventListener("submit", async event => {
        event.preventDefault()
        const name    = event.target.name.value
        const content = event.target.content.value
        if (!name || !content) return

        await fetch(event.target.action, { method: "POST", body: new URLSearchParams({name, content}) })

        const el = messageTemplate.cloneNode(true)
        el.classList.add("from-kagan", "message-out")
        el.querySelector(".msg-text").textContent = content
        messageList.append(el)
        
        messageList.scrollTop = messageList.scrollHeight
        event.target.content.value = ""
        event.target.content.focus()
        updateLastCemilHighlight()
    })

    async function poll_for_new_messages() {
        try {
            const response = await fetch("messages.json", { cache: "no-cache" })
            if (!response.ok) return

            const messages = await response.json()
            const atBottom = (messageList.scrollHeight - messageList.scrollTop - messageList.clientHeight) < 50

            for (const li of messageList.querySelectorAll("li.pending")) li.remove()

            const lastId = parseInt(messageList.dataset.lastMessageId ?? "-1")
            let hasNew = false

            for (const msg of messages) {
                if (msg.id > lastId) {
                    const date = new Date(msg.time * 1000)
                    
                    const dateStr = new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }).format(date);
                    if (window.lastDateDivider !== dateStr) {
                        const divider = document.createElement('li');
                        divider.className = 'date-divider';
                        divider.textContent = dateStr;
                        messageList.append(divider);
                        window.lastDateDivider = dateStr;
                    }

                    const timeStr = new Intl.DateTimeFormat('tr-TR', { hour: '2-digit', minute: '2-digit' }).format(date);

                    const el = messageTemplate.cloneNode(true)
                    el.classList.remove("pending")
                    
                    el.classList.add(msg.name === "cemil" ? "from-cemil" : "from-kagan")
                    el.classList.add(msg.name === "kagan" ? "message-out" : "message-in")

                    el.querySelector(".msg-text").innerHTML = linkify(msg.content)
                    el.querySelector(".message-time").textContent = ".... " + timeStr

                    messageList.append(el)
                    messageList.dataset.lastMessageId = msg.id
                    hasNew = true
                }
            }

            for (const li of Array.from(messageList.querySelectorAll("li:not(.date-divider)")).slice(0, -1000)) li.remove()
            if (hasNew) updateLastCemilHighlight()
            if (atBottom) messageList.scrollTop = messageList.scrollHeight - messageList.clientHeight

        } catch (_) {}
    }

    async function render_logs() {
        const logsContainer = document.getElementById("logs-area");
        const files = ['log.txt', 'r/log.txt'];
        const simdiRef = Math.floor(Date.now() / 1000) + (7 * 3600);
        
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        const bugunBaslangic = Math.floor(d.getTime() / 1000);

        let html = "";

        for (const file of files) {
            const delLink = "?del_log=" + encodeURIComponent(file);
            html += `<h2><span>${escapeHtml(file)}</span> <a href="${delLink}" style="color:#d9534f; font-size:0.75rem; font-weight:normal; text-decoration:none;">[son kaydı sil]</a></h2>\n`;

            try {
                const res = await fetch(file, { cache: "no-cache" });
                if (!res.ok) throw new Error();
                
                const text = await res.text();
                const lines = text.split(/\r?\n/);
                const last15Lines = lines.slice(-15).reverse();

                html += "<pre>";
                let ilkDoluBulundu = false;

                for (const satir of last15Lines) {
                    if (satir.trim() === "") {
                        html += "\n";
                        continue;
                    }

                    const pos = satir.indexOf("- ");
                    let zaman = false;
                    let escaped = "";

                    if (pos !== -1) {
                        const ip = satir.substring(0, pos).trim();
                        const kalan = satir.substring(pos + 2);
                        const tarihSaat = kalan.substring(0, 19).trim();
                        
                        zaman = Math.floor(new Date(tarihSaat.replace(' ', 'T')).getTime() / 1000);
                        const temizSatir = ip + " - " + tarihSaat;
                        escaped = escapeHtml(temizSatir);
                    } else {
                        escaped = escapeHtml(satir);
                    }

                    let isRed = false;
                    if (!ilkDoluBulundu) {
                        ilkDoluBulundu = true;
                        if (zaman && !isNaN(zaman)) {
                            const fark = simdiRef - zaman;
                            if (fark >= 0 && fark <= 3 * 3600) {
                                isRed = true;
                            }
                        }
                    }

                    if (isRed) {
                        html += `<span style="color:red">${escaped}</span>\n`;
                    } else if (zaman && !isNaN(zaman) && zaman < bugunBaslangic) {
                        html += `<span style="color:#888">${escaped}</span>\n`;
                    } else {
                        html += `${escaped}\n`;
                    }
                }
                html += "</pre>\n";
            } catch (_) {
                html += `<p style="color:#888; margin:0;">Dosya bulunamadı.</p>\n`;
            }
        }
        logsContainer.innerHTML = html;
    }

    poll_for_new_messages();
    setInterval(poll_for_new_messages, 3000);
    render_logs();
</script>
</body>
