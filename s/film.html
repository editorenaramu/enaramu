<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Film & Dizi Arşivi</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f4f9; color: #333; }
    body { padding: 20px 10px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    h2 { margin-top: 0; font-size: 1.3rem; border-bottom: 2px solid #eee; padding-bottom: 10px; color: #2c3e50; }
    form { display: flex; flex-direction: column; gap: 12px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #3498db; }
    button { background: #3498db; color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #2980b9; }
    button:disabled { background: #95a5a6; cursor: not-allowed; }
    .msg { display: none; padding: 12px; background: #d4edda; color: #155724; border-radius: 8px; margin-bottom: 15px; font-weight: bold; text-align: center;}
  </style>
</head>
<body>

<div class="container">
  <div id="msgBox" class="msg">✔ Başarıyla GitHub'a eklendi!</div>

  <div class="card">
    <h2>🎬 Film Ekle</h2>
    <form id="formMovie">
      <input type="text" id="mName" placeholder="Film adı" required autocomplete="off">
      <input type="text" id="mYear" placeholder="Yıl" required autocomplete="off">
      <button type="submit" id="btnMovie">Film Ekle</button>
    </form>
  </div>

  <div class="card">
    <h2>📺 Dizi Ekle</h2>
    <form id="formSeries">
      <input type="text" id="sName" placeholder="Dizi adı" required autocomplete="off">
      <input type="text" id="sSeason" placeholder="Sezonlar (1,2,3...)" required autocomplete="off">
      <input type="text" id="sDesc" placeholder="Açıklama (Opsiyonel)" autocomplete="off">
      <button type="submit" id="btnSeries">Dizi Ekle</button>
    </form>
  </div>
</div>

<script>
  const GH_TOKEN = "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";
  const GH_REPO = "editorenaramu/enaramu";
  const GH_FILE = "veri.json";
  const API_BASE = `https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`;

  const headers = {
    "Authorization": `token ${GH_TOKEN}`,
    "Accept": "application/vnd.github.v3+json",
    "Content-Type": "application/json"
  };

  function showMsg(text) {
    const box = document.getElementById('msgBox');
    box.textContent = text;
    box.style.display = 'block';
    setTimeout(() => box.style.display = 'none', 3000);
  }

  async function addToGitHub(newItem, type) {
    const btnId = type === 'movie' ? 'btnMovie' : 'btnSeries';
    const btn = document.getElementById(btnId);
    btn.disabled = true;
    btn.textContent = "Kaydediliyor...";

    try {
      // 1. Mevcut dosyayı ve SHA kodunu al
      const getRes = await fetch(API_BASE, { headers });
      if (!getRes.ok) throw new Error("Dosya okunamadı");
      const data = await getRes.json();
      
      // İçeriği çöz
      const jsonContent = JSON.parse(decodeURIComponent(escape(atob(data.content))));
      
      // Listeye yeni veriyi ekle
      if (type === 'movie') {
        jsonContent.filmler = jsonContent.filmler || [];
        jsonContent.filmler.push(newItem);
      } else {
        jsonContent.diziler = jsonContent.diziler || [];
        jsonContent.diziler.push(newItem);
      }

      // 2. GitHub'a güncelleme isteği at (PUT)
      const putRes = await fetch(API_BASE, {
        method: "PUT",
        headers,
        body: JSON.stringify({
          message: "Arayüzden yeni veri eklendi",
          content: btoa(unescape(encodeURIComponent(JSON.stringify(jsonContent, null, 2)))),
          sha: data.sha
        })
      });

      if (putRes.ok) {
        showMsg("✔ Başarıyla eklendi!");
        if (type === 'movie') document.getElementById('formMovie').reset();
        else document.getElementById('formSeries').reset();
      } else {
        alert("GitHub kayıt hatası!");
      }
    } catch (err) {
      alert("Bir hata oluştu: " + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = type === 'movie' ? "Film Ekle" : "Dizi Ekle";
    }
  }

  // Film Form Submit
  document.getElementById('formMovie').addEventListener('submit', (e) => {
    e.preventDefault();
    addToGitHub({
      adi: document.getElementById('mName').value.trim(),
      yil: document.getElementById('mYear').value.trim()
    }, 'movie');
  });

  // Dizi Form Submit
  document.getElementById('formSeries').addEventListener('submit', (e) => {
    e.preventDefault();
    addToGitHub({
      adi: document.getElementById('sName').value.trim(),
      sezon: document.getElementById('sSeason').value.trim(),
      aciklama: document.getElementById('sDesc').value.trim()
    }, 'series');
  });
</script>

</body>
</html>
